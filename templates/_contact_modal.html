<!-- CONTACT MODAL -->
<div class="modal-overlay" id="contactModal" onclick="if(event.target===this)closeContact()">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Get in <span>touch</span></h3>
      <button class="modal-close" onclick="closeContact()" aria-label="Close">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
    <div class="contact-items">
      <div class="contact-item">
        <div class="contact-icon"><i class="fa-solid fa-envelope" aria-hidden="true"></i></div>
        <div class="contact-info">
          <div class="contact-label">Email</div>
          <div class="contact-value">razashakir919@gmail.com</div>
        </div>
        <button class="copy-btn" onclick="copyText('razashakir919@gmail.com', this)">Copy</button>
      </div>
      <div class="contact-item">
        <div class="contact-icon"><i class="fa-brands fa-github" aria-hidden="true"></i></div>
        <div class="contact-info">
          <div class="contact-label">GitHub</div>
          <div class="contact-value">github.com/Shakir-Raza</div>
        </div>
        <button class="copy-btn" onclick="copyText('https://github.com/Shakir-Raza', this)">Copy</button>
      </div>
      <div class="contact-item">
        <div class="contact-icon"><i class="fa-brands fa-linkedin" aria-hidden="true"></i></div>
        <div class="contact-info">
          <div class="contact-label">LinkedIn</div>
          <div class="contact-value">linkedin.com/in/shakir-raza</div>
        </div>
        <button class="copy-btn" onclick="copyText('https://www.linkedin.com/in/shakir-raza', this)">Copy</button>
      </div>
    </div>
  </div>
</div>
