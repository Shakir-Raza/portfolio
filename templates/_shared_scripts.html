<script>
(function () {
  // Safari Private Browsing, in-app browsers (LinkedIn/Instagram/WhatsApp),
  // and strict tracking-prevention modes can make localStorage/sessionStorage
  // throw on access. Without these guards, that throw used to stop this whole
  // script — which meant the DOMContentLoaded handler below (and with it, the
  // code that dismisses the full-screen intro overlay) never ran, leaving
  // visitors stuck behind a frozen splash screen. Small helpers make every
  // storage access safe to call.
  function safeGet(store, key) {
    try { return store.getItem(key); } catch (e) { return null; }
  }
  function safeSet(store, key, value) {
    try { store.setItem(key, value); } catch (e) { /* ignore */ }
  }

  const root = document.documentElement;
  const stored = safeGet(window.localStorage, 'theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const initial = stored || (prefersDark ? 'dark' : 'light');
  root.setAttribute('data-theme', initial);

  function setTheme(mode) {
    root.setAttribute('data-theme', mode);
    safeSet(window.localStorage, 'theme', mode);
  }

  document.addEventListener('DOMContentLoaded', function () {
    const btn = document.getElementById('themeToggle');
    if (btn) {
      btn.addEventListener('click', function () {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        setTheme(next);
      });
    }

    const intro = document.getElementById('siteIntro');
    if (intro) {
      if (safeGet(window.sessionStorage, 'introSeen')) {
        intro.classList.add('is-done');
      } else {
        setTimeout(function () {
          intro.classList.add('is-done');
          safeSet(window.sessionStorage, 'introSeen', '1');
        }, 2200);
      }
    }
  });
})();

function openContact() {
  const m = document.getElementById('contactModal');
  if (m) m.classList.add('show');
}
function closeContact() {
  const m = document.getElementById('contactModal');
  if (m) m.classList.remove('show');
}
function copyText(text, btn) {
  navigator.clipboard.writeText(text);
  const prev = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(function () { btn.textContent = prev; }, 2000);
}

const revealEls = document.querySelectorAll('.reveal');
function markInView(el) { el.classList.add('in-view'); }

if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        markInView(e.target);
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
  revealEls.forEach(function (el) { io.observe(el); });
  requestAnimationFrame(function () {
    revealEls.forEach(function (el) {
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight * 0.92) markInView(el);
    });
  });
} else {
  revealEls.forEach(markInView);
}
</script>
